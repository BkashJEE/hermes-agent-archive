<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Entry social card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
<!--TOKENS-->
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;padding:48px 60px;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;border-top:6px solid var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;font:500 16px/1.5 var(--mono);letter-spacing:.06em;color:var(--ink-dim)}
.brand{color:var(--ink)}.brand span{color:var(--accent)}
.context{display:flex;align-items:center;gap:16px;letter-spacing:0;max-width:720px}
.agent{padding:6px 12px;border:1px solid var(--line-2);border-radius:5px;color:var(--ink)}
h1{font-size:54px;line-height:1.12;letter-spacing:-.035em;font-weight:600;overflow-wrap:anywhere;margin:34px 0 22px;flex:1;display:flex;align-items:center}
footer{border-top:1px solid var(--line-2);padding-top:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;font-size:23px;line-height:1.4}
.label{display:block;font:12px/1.5 var(--mono);color:var(--ink-mute);margin-bottom:8px;text-transform:uppercase;letter-spacing:.12em}
.credit,.source{overflow-wrap:anywhere}.source{text-align:right}.host{display:block;font:13px/1.6 var(--mono);color:var(--ink-dim);margin-top:5px}
</style>
<header><div class="brand">AGENT <span>DIRECTORY</span></div><div class="context"><span class="agent"><!--AGENT--></span><span><!--SHELF--></span></div></header>
<h1><!--TITLE--></h1>
<footer><div class="credit"><span class="label">Credit</span><!--CREDIT--></div><div class="source"><span class="label">Source</span><!--SOURCE--><span class="host"><!--HOST--></span></div></footer>
<script>
// Fit the complete recorded title, never truncate it into a different claim.
async function fit() {
  await document.fonts.ready;
  const title = document.querySelector('h1');
  for (let size = 54; size >= 24; size--) {
    title.style.fontSize = size + 'px';
    if (document.querySelector('footer').getBoundingClientRect().bottom <= 590 && title.scrollHeight <= title.clientHeight) break;
  }
}
fit();
</script></html>
