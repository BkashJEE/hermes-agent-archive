<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
<!--TOKENS-->
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      radial-gradient(640px 440px at 76% 48%,var(--wash-amber),transparent 66%),
      radial-gradient(560px 360px at 2% 104%,var(--wash-violet),transparent 62%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);
  }
  .edge{position:absolute;left:0;top:0;width:6px;height:100%;background:linear-gradient(var(--accent),var(--brand-shade) 55%,var(--teal))}
  svg.field{position:absolute;inset:0}
  .left{position:absolute;left:66px;top:58px;width:600px}
  .top{display:flex;align-items:center;gap:14px}
  .mark{width:44px;height:44px;border-radius:11px;background:linear-gradient(150deg,var(--panel-2),var(--panel));
        border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
  .mark svg{width:29px;height:29px}
  .kick{font-family:var(--mono);font-size:13px;letter-spacing:.26em;color:var(--accent);font-weight:700;white-space:nowrap}
  .count{font-family:var(--mono);font-size:156px;line-height:.9;font-weight:700;letter-spacing:-.05em;color:var(--accent);margin-top:46px}
  .line{font-size:40px;line-height:1.12;font-weight:600;letter-spacing:-.025em;margin-top:18px;max-width:15.5ch;color:var(--ink)}
  .facts{position:absolute;left:66px;bottom:118px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--ink-dim);white-space:nowrap}
  .facts b{color:var(--ink);font-weight:700}
  .facts .dot{margin:0 12px;color:var(--ink-mute)}
  .foot{position:absolute;left:66px;right:66px;bottom:56px;display:flex;align-items:flex-end;justify-content:space-between}
  .rule{width:34px;height:2px;background:var(--accent);margin-bottom:14px}
  .srcs{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-mute)}
  .by{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--ink-dim)}
  ul.legend{position:absolute;left:700px;right:66px;top:72px;list-style:none;display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
  .legend li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
  .legend li i{width:8px;height:8px;border-radius:50%}
  .legend li b{font-family:var(--mono);color:var(--ink);font-weight:700}
  .caption{position:absolute;right:66px;bottom:84px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--teal);text-align:right}
</style>
<div class="edge"></div>
<svg class="field" viewBox="0 0 1200 630"><!--DOTS--></svg>
<div class="left">
  <div class="top">
    <span class="mark"><svg viewBox="0 0 64 64">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--accent)"/><stop offset=".55" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--brand-shade)"/>
      </linearGradient></defs>
      <g transform="rotate(-19 32 32)" fill="url(#g)">
        <rect x="13" y="19" width="38" height="7.5" rx="3.75"/>
        <rect x="13" y="30" width="27" height="7.5" rx="3.75"/>
        <rect x="13" y="41" width="16" height="7.5" rx="3.75"/>
      </g><circle cx="45.5" cy="45" r="4" fill="var(--teal)"/></svg></span>
    <span class="kick"><!--KICKER--></span>
  </div>
  <div class="count"><!--COUNT--></div>
  <div class="line"><!--LINE--></div>
</div>
<div class="facts"><!--FACTS--></div>
<ul class="legend"><!--LEGEND--></ul>
<div class="foot">
  <div>
    <div class="rule"></div>
    <div class="srcs">X · REDDIT · DISCORD · HACKER NEWS · GITHUB · YOUTUBE · BLOGS · DOCS</div>
  </div>
  <div class="by">CURATED BY @BkashJosi</div>
</div>
<div class="caption"><!--CAPTION--></div>
