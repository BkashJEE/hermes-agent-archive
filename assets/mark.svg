<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hermes Agent Archive">
  <defs>
    <linearGradient id="hm-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c452"/>
      <stop offset="0.55" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#e08a10"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0a0a0f"/>
  <!-- Three shelves raked like a wing: the archive as Hermes' feathers.
       Widths fall away so the silhouette reads as flight at any size. -->
  <g transform="rotate(-19 32 32)" fill="url(#hm-a)">
    <rect x="13" y="19" width="38" height="7.5" rx="3.75"/>
    <rect x="13" y="30" width="27" height="7.5" rx="3.75"/>
    <rect x="13" y="41" width="16" height="7.5" rx="3.75"/>
  </g>
  <!-- The live signal: one entry landing on the shelf. -->
  <circle cx="45.5" cy="45" r="4" fill="#2dd4bf"/>
</svg>
