name: Bug report
description: Report a reproducible problem with the archive.
title: "[Bug]: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page or local commit, browser and screen size. For the Desktop plugin, also include OS, Hermes Desktop version, install method and whether Archive appears in Capabilities → Plugins. Do not include secrets or private logs.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
