name: Bug report
description: Report a reproducible problem with the archive.
title: "[Bug]: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page or local commit, browser and screen size. Do not include secrets or private logs.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
