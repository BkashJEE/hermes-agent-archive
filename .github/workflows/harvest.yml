name: Harvest new entries

on:
  # Every second day. The daily refresh keeps metrics and Trending honest; this is the
  # other half — the upstream sources themselves gain entries, and nothing re-read them
  # unless somebody remembered to. Offset from the refresh so the two never collide.
  schedule:
    - cron: '41 7 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    if: github.repository == 'BkashJEE/hermes-agent-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }

      - name: Re-read the sources that grow
        id: harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'summary<<HARVEST_EOF'
            npm run harvest --silent
            echo HARVEST_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Classify whatever arrived
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            npm run rank
          else
            echo "Jev key unavailable; new entries stay unclassified until a later run."
          fi

      # A harvest that breaks the archive is worse than one that finds nothing, so this
      # gate runs before anything is proposed rather than after review.
      - name: Validate
        run: |
          npm run check
          npm test

      - name: Propose the new entries for owner review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "The sources had nothing new; no proposal to make."
            exit 0
          fi
          added="$(git diff --staged -U0 -- data/ | grep -cE '^\+.*"id":' || true)"
          title="Harvest — ${added} new $([ "$added" = "1" ] && echo entry || echo entries) from upstream sources"
          branch="automation/harvest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "$title"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/harvest-pr.md" <<BODY
          Re-read the upstream sources that grow and merged what was new.

          \`\`\`
          ${{ steps.harvest.outputs.summary }}
          \`\`\`

          Every importer here merges by id and never removes an entry; the harvest
          restores the archive and fails if any shelf shrinks. Prompts, Hidden Tricks and
          community submissions are deliberately absent — each asserts something a fetch
          cannot establish, so they stay on reviewed manifests.

          Validation: \`npm run check\` and \`npm test\` passed. New entries are classified
          when a Jev key is available, and appear as unclassified otherwise.

          Merging this does not publish it. The Vercel project has no Git integration, so
          the site changes only when someone deploys from main.
          BODY
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/harvest-pr.md"
