name: Refresh live signals

on:
  # A free archive that stops moving stops being worth opening. This runs itself daily
  # and proposes what it found; it still cannot publish, because merging is the owner's
  # act and deployment is a separate one after that.
  schedule:
    - cron: '17 6 * * *'        # 06:17 UTC daily — off the hour, where the runner queue is shorter
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  refresh:
    if: github.repository == 'BkashJEE/hermes-agent-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      # The fetcher writes data/live.json before it reports a failure, because the figures
      # it did get are worth keeping on a run where something else broke. Letting a
      # non-zero exit stop the job here would throw them away again; the failure is
      # reported in the last step instead, after the update has been proposed.
      - name: Fetch public metrics
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          set +e
          node scripts/fetch-signals.mjs
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Route signals onto their shelves
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/route-signals.mjs
      - name: Update archive classifications
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            npm run rank
          else
            echo "Jev key unavailable; changed entries will be marked unclassified."
          fi
      - name: Validate proposed update
        run: |
          npm run check
          npm test
      - name: Propose update for owner review
        id: propose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/rankings.json
          if git diff --staged --quiet; then
            echo "Nothing changed; no proposal to make."
            exit 0
          fi
          # Work out what was found before committing, while the previous state is still
          # what HEAD holds. The title is the notification: it has to say whether this run
          # is worth opening.
          title="$(node scripts/summarise-refresh.mjs)"
          node scripts/summarise-refresh.mjs --body > "$RUNNER_TEMP/refresh-pr.md"
          branch="automation/refresh-signals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/refresh-pr.md"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Off unless the owner sets the repository variable AUTO_PUBLISH to true. The proposal
      # above already passed npm run check and npm test in this job; this only decides
      # whether it waits for a person. If main still requires a review that this token
      # cannot give, the merge is refused and the pull request simply waits, as before.
      - name: Publish without waiting, if the owner has opted in
        if: vars.AUTO_PUBLISH == 'true' && steps.propose.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A pull request opened with the workflow token starts no workflows, so the required
          # "validate" check never appears on it and the merge is refused. This job already ran
          # npm run check and npm test on exactly this tree, so it reports that result as the
          # check, under the same name, on the commit it is about to merge. Nothing is skipped:
          # a failing Validate step above stops the job before anything is proposed.
          sha="$(git rev-parse "${{ steps.propose.outputs.branch }}")"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --silent \
            -f name=validate -f head_sha="$sha" -f status=completed -f conclusion=success \
            -f "output[title]=npm run check and npm test passed in the proposing run" \
            -f "output[summary]=Validated in workflow run ${GITHUB_RUN_ID} before the pull request was opened."
          if gh pr merge "${{ steps.propose.outputs.branch }}" --merge --delete-branch; then
            gh workflow run deploy.yml --ref main
            echo "::notice::Merged and dispatched the production deploy."
          else
            echo "::notice::Auto-merge was refused by the branch rules; the pull request waits for review."
          fi

      # Last, so a broken source is reported without costing the run the figures it did get.
      - name: Report a failed source
        if: steps.fetch.outputs.exit != '0'
        run: |
          echo "::error::A configured source failed; its previous figures were kept and marked stale."
          exit 1
