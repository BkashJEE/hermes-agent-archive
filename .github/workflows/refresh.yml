name: Refresh live signals

on:
  # Daily research is handled by the archive updater agent; this is the manual fallback.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.repository == 'BkashJEE/hermes-agent-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Fetch public metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: node scripts/fetch-signals.mjs

      - name: Route signals onto their shelves
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/route-signals.mjs
      - name: Update archive classifications
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ]; then
            npm run rank
          else
            echo "Jev key unavailable; changed entries will be marked unclassified."
          fi
      - name: Validate proposed update
        run: |
          npm run check
          npm test
      - name: Propose update for owner review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/rankings.json
          if git diff --staged --quiet; then exit 0; fi
          branch="automation/refresh-signals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Refresh public signals for review"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/refresh-pr.md" <<'BODY'
          Refresh public API snapshots and the associated archive classifications.

          Validation: npm run check and npm test passed. Review eligibility,
          freshness and any source warnings before approving publication.
          BODY
          gh pr create --base main --head "$branch" --title "Refresh public signals" --body-file "$RUNNER_TEMP/refresh-pr.md"
